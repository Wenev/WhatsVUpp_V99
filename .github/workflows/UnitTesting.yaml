name: Unit Testing

on:
  push:
    branches:
      - main
jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.5'

    - name: Run unit tests
      working-directory: ../../backend-go
      run: go test ./...
